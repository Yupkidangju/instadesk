name: Desktop CI and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
            command: package:win
            archive: zip
          - target: linux-x64
            runner: ubuntu-24.04
            command: package:linux
            archive: tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            command: package:linux
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run desktop:install
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: npm run ${{ matrix.command }}
      - name: Smoke Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $name = "InstaDesk-$version-win-x64"
          Expand-Archive -LiteralPath "release/$name.zip" -DestinationPath smoke
          $exe = (Resolve-Path "smoke/$name/InstaDesk.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Windows smoke failed: $($process.ExitCode)" }
      - name: Smoke Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          name="InstaDesk-${version}-${{ matrix.target }}"
          sudo install -d -m 0755 /opt/instadesk
          sudo tar -xzf "release/${name}.tar.gz" -C /opt/instadesk
          sudo chown -R root:root "/opt/instadesk/${name}"
          sudo chmod 4755 "/opt/instadesk/${name}/chrome-sandbox"
          test -x "/opt/instadesk/${name}/InstaDesk"
          test -f "/opt/instadesk/${name}/LINUX_SETUP.md"
          test "$(stat -c '%u:%a' "/opt/instadesk/${name}/chrome-sandbox")" = '0:4755'
          binary_type=$(file -b "/opt/instadesk/${name}/InstaDesk")
          echo "$binary_type"
          if [ "${{ matrix.target }}" = 'linux-arm64' ]; then
            grep -q 'ARM aarch64' <<< "$binary_type"
          else
            grep -q 'x86-64' <<< "$binary_type"
          fi
          xvfb-run -a "/opt/instadesk/${name}/InstaDesk" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: InstaDesk-${{ matrix.target }}
          path: release/InstaDesk-*.${{ matrix.archive }}
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tag version
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: actions/download-artifact@v4
        with:
          pattern: InstaDesk-*
          merge-multiple: true
          path: release-assets
      - run: node scripts/verify-release-assets.mjs release-assets
      - name: Checksums
        shell: bash
        run: cd release-assets && sha256sum InstaDesk-* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "InstaDesk $version" --notes-file "docs/releases/v${version}.md"
